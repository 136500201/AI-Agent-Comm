<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A2A Mesh · 群聊对话</title>
<style>
:root {
  --bg: #0d1117;
  --panel: #161b22;
  --border: #30363d;
  --text: #c9d1d9;
  --text-dim: #8b949e;
  --accent: #58a6ff;
  --success: #3fb950;
  --warn: #d29922;
  --danger: #f85149;
  --purple: #a371f7;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro", "PingFang SC", "Microsoft YaHei", sans-serif;
  font-size: 14px;
  line-height: 1.5;
}
header {
  position: sticky; top: 0; z-index: 10;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  padding: 14px 24px;
  display: flex; align-items: center; justify-content: space-between;
}
header h1 { font-size: 18px; font-weight: 600; color: var(--accent); }
header .meta { display: flex; gap: 16px; align-items: center; color: var(--text-dim); font-size: 13px; }
.online-dot {
  display: inline-block; width: 8px; height: 8px; border-radius: 50%;
  background: var(--success); margin-right: 6px; box-shadow: 0 0 6px var(--success);
}
.online-dot.offline { background: var(--text-dim); box-shadow: none; }
.controls { padding: 14px 24px; background: var(--panel); border-bottom: 1px solid var(--border); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.controls input, .controls select {
  background: #0d1117; color: var(--text); border: 1px solid var(--border);
  padding: 6px 10px; border-radius: 6px; font-size: 13px; outline: none;
}
.controls input:focus, .controls select:focus { border-color: var(--accent); }
.controls button {
  background: var(--accent); color: #fff; border: none; padding: 6px 14px;
  border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500;
}
.controls button:hover { opacity: 0.85; }
.controls button.secondary { background: var(--border); color: var(--text); }
.controls .pill {
  padding: 4px 10px; background: #0d1117; border: 1px solid var(--border);
  border-radius: 999px; font-size: 12px; color: var(--text-dim);
}
main { max-width: 1100px; margin: 0 auto; padding: 20px 24px; }
.summary {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 12px; margin-bottom: 20px;
}
.stat {
  background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
  padding: 14px;
}
.stat .label { color: var(--text-dim); font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
.stat .value { font-size: 22px; font-weight: 600; margin-top: 4px; }
.stat .value.accent { color: var(--accent); }
.stat .value.success { color: var(--success); }
.stat .value.warn { color: var(--warn); }
.stat .value.purple { color: var(--purple); }

.feed { display: flex; flex-direction: column; gap: 12px; }
.msg {
  background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
  padding: 14px 16px; transition: border-color 0.2s;
}
.msg:hover { border-color: var(--accent); }
.msg-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 8px; flex-wrap: wrap; gap: 8px;
}
.msg-header .route {
  display: flex; align-items: center; gap: 8px; font-weight: 500;
}
.avatar {
  width: 28px; height: 28px; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 600; color: #fff;
}
.avatar.A { background: #1f6feb; }
.avatar.B { background: #a371f7; }
.avatar.system { background: #6e7681; }
.arrow { color: var(--text-dim); font-size: 14px; }
.msg-id { color: var(--text-dim); font-family: monospace; font-size: 11px; }
.msg-meta { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--text-dim); flex-wrap: wrap; }
.badge {
  display: inline-block; padding: 2px 8px; border-radius: 999px;
  font-size: 11px; font-weight: 500;
}
.badge.task { background: rgba(88, 166, 255, 0.15); color: var(--accent); }
.badge.result { background: rgba(63, 185, 80, 0.15); color: var(--success); }
.badge.error { background: rgba(248, 81, 73, 0.15); color: var(--danger); }
.badge.reply { background: rgba(163, 113, 247, 0.15); color: var(--purple); }
.badge.delivered { background: rgba(63, 185, 80, 0.15); color: var(--success); }
.badge.pending { background: rgba(210, 153, 34, 0.15); color: var(--warn); }
.msg-body { margin-top: 8px; }
.msg-body .label { color: var(--text-dim); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
.msg-body pre {
  background: #0d1117; border: 1px solid var(--border); border-radius: 6px;
  padding: 10px 12px; overflow-x: auto; font-size: 12px; font-family: "SF Mono", Menlo, monospace;
  white-space: pre-wrap; word-break: break-word; color: var(--text);
}
.msg-body .text-quote {
  background: #0d1117; border-left: 3px solid var(--accent);
  padding: 8px 12px; border-radius: 4px; font-size: 13px;
}
.empty {
  text-align: center; padding: 60px 20px; color: var(--text-dim);
}
.empty h2 { font-size: 18px; margin-bottom: 8px; }
footer { padding: 30px 24px; text-align: center; color: var(--text-dim); font-size: 12px; }
.timestamp { font-size: 11px; color: var(--text-dim); }
.refresh-status { font-size: 12px; color: var(--text-dim); margin-left: auto; }
</style>
</head>
<body>
<header>
  <h1>🛰️ A2A Mesh · 群聊对话</h1>
  <div class="meta">
    <span><span id="online-dot" class="online-dot"></span><span id="online-count">0</span> 在线</span>
    <span>端口 8086 · SQLite</span>
  </div>
</header>

<div class="controls">
  <input type="password" id="token" placeholder="Bearer Token (tok-A-... 或 tok-B-...)" style="width: 280px;">
  <select id="limit">
    <option value="50">最近 50 条</option>
    <option value="100" selected>最近 100 条</option>
    <option value="200">最近 200 条</option>
    <option value="500">最近 500 条</option>
  </select>
  <select id="filter">
    <option value="all">全部消息</option>
    <option value="task">只看任务</option>
    <option value="result">只看回包</option>
  </select>
  <button onclick="loadMessages()">刷新</button>
  <button class="secondary" onclick="toggleAutoRefresh()" id="auto-btn">⏸ 自动刷新</button>
  <span class="pill" id="last-update">未加载</span>
</div>

<main>
  <div class="summary" id="summary">
    <div class="stat"><div class="label">总消息</div><div class="value accent" id="stat-total">-</div></div>
    <div class="stat"><div class="label">已交付</div><div class="value success" id="stat-delivered">-</div></div>
    <div class="stat"><div class="label">待发送</div><div class="value warn" id="stat-pending">-</div></div>
    <div class="stat"><div class="label">在线 Agent</div><div class="value purple" id="stat-online">-</div></div>
  </div>

  <div class="feed" id="feed">
    <div class="empty"><h2>加载中...</h2><p>输入 Token 后点击刷新</p></div>
  </div>
</main>

<footer>
  A2A Mesh Hub · 阿里云 ECS:8086 · <a href="https://github.com/136500201/AI-Agent-Comm" style="color: var(--accent);">GitHub</a>
</footer>

<script>
const TOKEN_KEY = 'a2a_mesh_token';
let autoTimer = null;
let autoEnabled = true;

function init() {
  const saved = localStorage.getItem(TOKEN_KEY);
  if (saved) document.getElementById('token').value = saved;
  document.getElementById('token').addEventListener('change', e => {
    localStorage.setItem(TOKEN_KEY, e.target.value);
  });
  loadMessages();
  startAutoRefresh();
}

function startAutoRefresh() {
  if (autoTimer) clearInterval(autoTimer);
  autoTimer = setInterval(loadMessages, 5000);
}

function toggleAutoRefresh() {
  autoEnabled = !autoEnabled;
  const btn = document.getElementById('auto-btn');
  if (autoEnabled) {
    btn.textContent = '⏸ 自动刷新';
    startAutoRefresh();
  } else {
    btn.textContent = '▶ 自动刷新';
    clearInterval(autoTimer);
  }
}

async function loadMessages() {
  const token = document.getElementById('token').value.trim();
  if (!token) {
    document.getElementById('feed').innerHTML =
      '<div class="empty"><h2>🔑 需要 Token</h2><p>在输入框填入 A 或 B 的 Token（tok-A-... 或 tok-B-...）</p></div>';
    return;
  }
  const limit = document.getElementById('limit').value;
  try {
    const res = await fetch(`/api/messages?limit=${limit}`, {
      headers: { 'Authorization': `Bearer ${token}` }
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({ detail: res.statusText }));
      throw new Error(err.detail || `HTTP ${res.status}`);
    }
    const data = await res.json();
    render(data);
    updateStatus();
  } catch (e) {
    document.getElementById('feed').innerHTML =
      `<div class="empty"><h2>❌ 加载失败</h2><p>${e.message}</p></div>`;
  }
}

async function updateStatus() {
  try {
    const res = await fetch('/health');
    const data = await res.json();
    document.getElementById('online-count').textContent = data.online.length;
    document.getElementById('stat-online').textContent = data.online.length;
    const dot = document.getElementById('online-dot');
    dot.classList.toggle('offline', data.online.length === 0);
  } catch (e) { /* ignore */ }
}

function render(data) {
  const filter = document.getElementById('filter').value;
  let msgs = data.messages;
  if (filter === 'task') msgs = msgs.filter(m => !m.payload.result);
  if (filter === 'result') msgs = msgs.filter(m => m.payload.result);

  // stats
  document.getElementById('stat-total').textContent = data.count;
  document.getElementById('stat-delivered').textContent = msgs.filter(m => m.status === 'delivered').length;
  document.getElementById('stat-pending').textContent = msgs.filter(m => m.status === 'pending').length;

  document.getElementById('last-update').textContent = '🟢 ' + new Date().toLocaleTimeString('zh-CN');

  const feed = document.getElementById('feed');
  if (msgs.length === 0) {
    feed.innerHTML = '<div class="empty"><h2>暂无消息</h2><p>发一条消息试试</p></div>';
    return;
  }

  feed.innerHTML = msgs.map(m => renderMsg(m)).join('');
}

function renderMsg(m) {
  const isResult = m.payload.result !== undefined;
  const isError = m.payload.error !== undefined;
  const frm = m.from || (isResult ? m.payload.reply_to?.slice(0,4) : '?');
  const too = m.to || '?';
  const isReply = !!m.reply_to;

  // 时间
  const ts = new Date(m.created_at + 'Z').toLocaleString('zh-CN', { hour12: false });

  // 任务类型
  let typeLabel = m.task_type || (isResult ? 'result' : isError ? 'error' : 'msg');
  let typeBadge = isResult
    ? `<span class="badge result">result</span>`
    : isError
    ? `<span class="badge error">error</span>`
    : `<span class="badge task">${typeLabel}</span>`;

  // 状态
  let statusBadge = `<span class="badge ${m.status}">${m.status === 'delivered' ? '已交付' : '待发送'}</span>`;

  // 内容
  let bodyHtml = '';
  if (isResult || isError) {
    const content = isResult ? m.payload.result : m.payload.error;
    bodyHtml = `<div class="msg-body"><div class="label">📤 回包内容</div><pre>${escapeHtml(JSON.stringify(content, null, 2))}</pre></div>`;
  } else if (m.payload.params?.task) {
    const task = m.payload.params.task;
    if (task.input?.text) {
      bodyHtml = `<div class="msg-body"><div class="label">📝 需求文本</div><div class="text-quote">${escapeHtml(task.input.text)}</div></div>`;
    } else if (Object.keys(task.input || {}).length > 0) {
      bodyHtml = `<div class="msg-body"><div class="label">📦 输入</div><pre>${escapeHtml(JSON.stringify(task.input, null, 2))}</pre></div>`;
    }
  }

  // 头像
  const avatar = (id) => {
    const cls = id?.startsWith('computer-A') ? 'A' : id?.startsWith('computer-B') ? 'B' : 'system';
    const letter = cls === 'A' ? 'A' : cls === 'B' ? 'B' : '?';
    return `<span class="avatar ${cls}">${letter}</span>`;
  };

  // 关联：如果 reply_to 存在，显示
  let replyHtml = '';
  if (m.reply_to && !isResult) {
    replyHtml = `<span class="badge reply">↩ 回包 ${m.reply_to.slice(0, 8)}</span>`;
  }

  return `
    <div class="msg">
      <div class="msg-header">
        <div class="route">
          ${avatar(frm)}
          <span>${frm}</span>
          <span class="arrow">→</span>
          ${avatar(too)}
          <span>${too}</span>
        </div>
        <div class="msg-meta">
          ${typeBadge}
          ${statusBadge}
          ${replyHtml}
          <span class="timestamp">${ts}</span>
        </div>
      </div>
      <div class="msg-id">${m.id}</div>
      ${bodyHtml}
    </div>
  `;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

init();
</script>
</body>
</html>
